services:
  api:
    build: .
    command: ["node", "dist/api/index.js"]
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_KEY=${ADMIN_KEY}
      - URL_SIGNING_SECRET=${URL_SIGNING_SECRET}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - FILES_DIR=/data/files
      - CREDENTIAL_MASTER_KEY=${CREDENTIAL_MASTER_KEY}
    volumes:
      - mq-files:/data/files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    command: ["node", "dist/worker/index.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - WORKER_QUEUES=${WORKER_QUEUES:-media,integrations}
      - URL_SIGNING_SECRET=${URL_SIGNING_SECRET}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - FILES_DIR=/data/files
      - CREDENTIAL_MASTER_KEY=${CREDENTIAL_MASTER_KEY}
    volumes:
      - mq-files:/data/files

  board:
    build: .
    command: ["node", "dist/board/index.js"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
    # Nur loopback auf dem Host — Zugriff ausschließlich via SSH-Tunnel,
    # z.B.: ssh -L 5100:localhost:5100 cwe-hostinger
    ports:
      - "127.0.0.1:5100:3000"

volumes:
  mq-files:
