# Lokale Entwicklungs-Infrastruktur: nur Redis + Postgres.
# Die App läuft auf dem Host (npm run dev:api / dev:worker) — debugbar, Watch-Mode.
services:
  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=mq
    ports:
      - "5432:5432"
    volumes:
      - mq-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mq"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mq-dev-pg:
